alumniCallout:
  badge: "Levante Stories"
  title: "From the sand to the coaching staff: closing the circle"
  story: "Our proudest milestone is seeing alumni who grew up in our classes return as youth tutors and staff members. Those who once received encouragement are now leading and inspiring the next generation."
  cta:
    label: "Meet Our Team"
    href: "/en/team/"

