title: 'Our Team'
intro: 'Meet the passionate team behind Instituto Levante — from founders and lead coaches to youth tutors and support staff.'

alumniSpotlight:
  enabled: true
  badge: 'From the Sand to the Staff'
  title: 'The inspiring journey of youth who grew up with us'
  story: 'Our work becomes truly sustainable when the young people we serve step into leadership roles. At Levante, we are honored to have program alumni working directly as tutors and educators, paying forward their experience and motivating incoming students with their personal stories.'
  quote: 'I first walked onto this sand without knowing how to serve a volleyball and often without having had breakfast. Standing here today coaching and mentoring these kids is the greatest achievement of my life.'
  memberName: 'Lucas Nascimento'
  memberRole: 'Youth Coach & Tutor • Alumni (Class of 2020)'

