alumniCallout:
  badge: 'Histórias do Levante'
  title: 'Da areia para a equipe: o ciclo que se completa'
  story: 'Nosso maior orgulho é ver ex-alunos que cresceram nas nossas turmas se tornando monitores e educadores do instituto. Quem um dia recebeu apoio hoje inspira a próxima geração de atletas e cidadãos.'
  cta:
    label: 'Conheça Nossa Equipe'
    href: '/equipe/'

