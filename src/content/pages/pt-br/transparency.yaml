title: 'Transparência e Governança'
intro: 'Prestação de contas clara, ética e aberta a toda a sociedade. Acreditamos que a confiança dos nossos parceiros, famílias e comunidade se constrói com rigor e transparência.'

governanceNotes: 'O Instituto Levante é uma organização sem fins lucrativos legalmente constituída no Brasil, com estatuto social registrado, CNPJ ativo e prestação periódica de contas aos órgãos competentes.'

