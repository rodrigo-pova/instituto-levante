title: 'Fale com o Instituto Levante'
intro: 'Dúvidas sobre matrículas, voluntariado, doações ou parcerias? Nossa equipe está à disposição para conversar.'
locationTitle: 'Onde nos encontrar'
locationText: 'Nossas aulas e círculos de leitura acontecem na praia de Ipanema (altura do Posto 8 / 9), Rio de Janeiro, todas as terças e quintas-feiras.'
