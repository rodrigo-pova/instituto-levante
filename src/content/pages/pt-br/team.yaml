title: "Nossa Equipe"
intro: "Conheça quem faz o Instituto Levante acontecer todos os dias — dos fundadores aos educadores, monitores e profissionais de apoio."

alumniSpotlight:
  enabled: true
  badge: "Da Areia para a Equipe"
  title: "A história de quem cresceu nas nossas turmas"
  story: "Nosso projeto se torna verdadeiramente sustentável quando os próprios jovens atendidos assumem papéis de liderança. No Levante, temos orgulho de contar com ex-alunos que hoje atuam diretamente como monitores e educadores, retribuindo o aprendizado e inspirando as novas turmas com sua trajetória."
  quote: "Eu cheguei aqui sem saber sacar uma bola e muitas vezes sem ter tomado café da manhã. Hoje, estar do outro lado ensinando e cuidando das crianças é a maior vitória da minha vida."
  memberName: "Lucas Nascimento"
  memberRole: "Monitor Técnico • Ex-aluno (Turma de 2020)"

