hero:
  badge: 'Parcerias de Impacto'
  title: 'Invista no futuro de crianças e jovens através do esporte e da cultura'
  subtitle: 'Sua empresa pode transformar vidas no Rio de Janeiro apoiando um projeto estruturado, auditável e com impacto social mensurável — incluindo incentivos fiscais via Lei do Esporte.'
  primaryCta:
    label: 'Apresentar uma Proposta'
    href: '#formulario-parceria'
  mediaKitPdf:
    label: 'Baixar Mídia Kit (PDF)'
    file: '/uploads/docs/midia-kit-instituto-levante.pdf'

whyPartner:
  title: 'Por que investir no Instituto Levante?'
  intro: 'Conecte a marca da sua empresa a um projeto sério, transparente e profundamente integrado à comunidade.'
  items:
    - title: 'Impacto Social Comprovado & Direto'
      body: 'Seu investimento chega diretamente na areia: alimentação equilibrada em 100% dos treinos, materiais esportivos oficiais e acesso cultural contínuo.'
    - title: 'Alinhamento com Metas ESG & ODS'
      body: 'Apoie diretamente os Objetivos de Desenvolvimento Sustentável da ONU: Saúde e Bem-Estar (ODS 3), Educação de Qualidade (ODS 4) e Redução das Desigualdades (ODS 10).'
    - title: 'Visibilidade e Associação de Marca Positiva'
      body: 'Presença em uniformes de treino, placas na praia, eventos abertos à comunidade, redes sociais e relatórios anuais de sustentabilidade.'
    - title: 'Governança Ética e Prestação de Contas'
      body: 'Contabilidade transparente, relatórios de atividades semestrais e auditoria aberta para parceiros institucionais.'

incentiveFocus:
  badge: 'Incentivo Fiscal (Lucro Real)'
  title: 'Patrocine com 100% de dedução fiscal via Lei de Incentivo ao Esporte'
  body: 'A Lei Federal nº 11.438/2006 permite que pessoas jurídicas tributadas com base no Lucro Real destinem até 2% do seu Imposto de Renda devido para projetos esportivos aprovados pelo Ministério do Esporte, sem nenhum custo adicional para a empresa.'
  steps:
    - number: '01'
      title: 'Simulação do Imposto'
      description: 'Sua equipe contábil ou fiscal calcula o potencial de direcionamento de até 2% do IRPJ devido do exercício fiscal.'
    - number: '02'
      title: 'Depósito Direto na Conta Vinculada'
      description: 'O aporte é feito diretamente na conta bancária do projeto, aberta no Banco do Brasil e monitorada pelo Ministério do Esporte.'
    - number: '03'
      title: 'Emissão do Recibo de Mecenato'
      description: 'O Instituto emite o comprovante oficial para que sua empresa realize a dedução integral na declaração de IRPJ.'
    - number: '04'
      title: 'Acompanhamento & Relatórios'
      description: 'Sua empresa recebe relatórios fotográficos periódicos, convites para vivências e prestação de contas detalhada.'
  callout: 'Tem dúvidas sobre o cálculo ou enquadramento fiscal? Nossa equipe jurídica e de captação elabora simulações sob medida para o seu time tributário.'

